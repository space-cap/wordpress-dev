services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress-server
    restart: unless-stopped

    ports:
      - "8088:80"

    environment:
      WORDPRESS_DB_HOST: host.docker.internal:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass

    volumes:
      - ./wordpress:/var/www/html

    networks:
      - wordpress-network

  # 🆕 파이썬 실시간 자동화 컨테이너 추가
  automation:
    build:
      context: ./automation
      dockerfile: Dockerfile
    container_name: paradin-automation
    restart: always
    ports:
      - "8089:8089"
    volumes:
      - ./automation:/app
      - /app/venv # 볼륨 마운트 시 가상환경 폴더 공유 예외 처리
    env_file:
      - ./automation/.env
    networks:
      - wordpress-network

networks:
  wordpress-network:
    driver: bridge
    